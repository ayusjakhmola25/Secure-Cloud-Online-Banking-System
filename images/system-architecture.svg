<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b1220"/><stop offset="100%" stop-color="#111c31"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f766e"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6d28d9"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#263449"/><stop offset="100%" stop-color="#1b283a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#000000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#93a4bb"/></marker>
    <style>
      .title{font:700 31px Arial,sans-serif;fill:#f8fafc}.subtitle{font:400 15px Arial,sans-serif;fill:#b8c5d8}
      .head{font:700 18px Arial,sans-serif;fill:#fff}.body{font:400 14px Arial,sans-serif;fill:#e1e9f3}.small{font:400 12px Arial,sans-serif;fill:#c5d0df}
      .line{stroke:#93a4bb;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.dash{stroke:#7dd3fc;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
      .panel{fill:#142033;stroke:#33465f;stroke-width:1.4}.card{stroke:#ffffff;stroke-opacity:.18;stroke-width:1.2;filter:url(#shadow)}
      .tag{font:700 11px Arial,sans-serif;fill:#dbeafe;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1400" height="980" rx="24" fill="url(#bg)"/>
  <text x="700" y="56" text-anchor="middle" class="title">SECURE CLOUD ONLINE BANKING SYSTEM</text>
  <text x="700" y="84" text-anchor="middle" class="subtitle">Application architecture • Flask, MySQL, authentication, banking workflows and administration</text>

  <rect x="48" y="118" width="1304" height="130" rx="18" class="panel"/>
  <text x="72" y="145" class="tag">PRESENTATION LAYER</text>
  <rect x="105" y="162" width="330" height="64" rx="12" fill="url(#blue)" class="card"/>
  <text x="270" y="187" text-anchor="middle" class="head">Customer Browser</text>
  <text x="270" y="208" text-anchor="middle" class="body">Register • Login • Dashboard • Transactions</text>
  <rect x="535" y="162" width="330" height="64" rx="12" fill="url(#purple)" class="card"/>
  <text x="700" y="187" text-anchor="middle" class="head">Administrator Browser</text>
  <text x="700" y="208" text-anchor="middle" class="body">Admin login • Users • Accounts • Monitoring</text>
  <rect x="965" y="162" width="330" height="64" rx="12" fill="url(#slate)" class="card"/>
  <text x="1130" y="187" text-anchor="middle" class="head">Web Interface</text>
  <text x="1130" y="208" text-anchor="middle" class="body">HTML • CSS • JavaScript • Jinja2 templates</text>

  <path d="M270 226 V278 H700 V306" class="line"/>
  <path d="M700 226 V306" class="line"/>
  <path d="M1130 226 V278 H700" class="line"/>

  <rect x="48" y="306" width="1304" height="106" rx="18" fill="#132b43" stroke="#2c6382" stroke-width="1.5"/>
  <text x="72" y="334" class="tag">APPLICATION ENTRY POINT</text>
  <rect x="330" y="350" width="740" height="42" rx="10" fill="url(#blue)" class="card"/>
  <text x="700" y="376" text-anchor="middle" class="head">run.py → Flask create_app() → Blueprint Routing</text>

  <path d="M700 392 V435" class="line"/>
  <rect x="48" y="435" width="1304" height="224" rx="18" class="panel"/>
  <text x="72" y="464" class="tag">APPLICATION / BUSINESS LOGIC LAYER</text>
  <rect x="82" y="487" width="278" height="76" rx="12" fill="url(#blue)" class="card"/>
  <text x="221" y="513" text-anchor="middle" class="head">Authentication</text>
  <text x="221" y="535" text-anchor="middle" class="body">Register • Login • OTP • Session</text>
  <text x="221" y="552" text-anchor="middle" class="small">app/routes/auth.py</text>
  <rect x="390" y="487" width="278" height="76" rx="12" fill="url(#teal)" class="card"/>
  <text x="529" y="513" text-anchor="middle" class="head">Customer Dashboard</text>
  <text x="529" y="535" text-anchor="middle" class="body">Profile • Account • Balance</text>
  <text x="529" y="552" text-anchor="middle" class="small">app/routes/dashboard.py</text>
  <rect x="698" y="487" width="278" height="76" rx="12" fill="url(#purple)" class="card"/>
  <text x="837" y="513" text-anchor="middle" class="head">Banking Transactions</text>
  <text x="837" y="535" text-anchor="middle" class="body">Deposit • Withdraw • Transfer</text>
  <text x="837" y="552" text-anchor="middle" class="small">app/routes/transactions.py</text>
  <rect x="1006" y="487" width="278" height="76" rx="12" fill="#9a3412" class="card"/>
  <text x="1145" y="513" text-anchor="middle" class="head">Admin Management</text>
  <text x="1145" y="535" text-anchor="middle" class="body">Users • Account status • Audit views</text>
  <text x="1145" y="552" text-anchor="middle" class="small">app/routes/admin.py</text>
  <path d="M221 563 V590 H1145 V563" stroke="#71849d" stroke-width="1.6" fill="none"/>
  <text x="700" y="619" text-anchor="middle" class="body">Shared controls: session checks • role checks • CSRF protection • parameterized SQL</text>
  <text x="700" y="641" text-anchor="middle" class="small">Security helpers: bcrypt password verification • AES-GCM field encryption • SHA-256 helper</text>

  <path d="M221 659 V692 H700 V716" class="line"/>
  <path d="M529 659 V692 H700" class="line"/>
  <path d="M837 659 V692 H700" class="line"/>
  <path d="M1145 659 V692 H700" class="line"/>

  <rect x="48" y="716" width="780" height="196" rx="18" fill="#102d2b" stroke="#247d73" stroke-width="1.5"/>
  <text x="72" y="745" class="tag">DATA LAYER</text>
  <rect x="92" y="768" width="310" height="112" rx="12" fill="url(#teal)" class="card"/>
  <text x="247" y="795" text-anchor="middle" class="head">MySQL Database</text>
  <text x="247" y="820" text-anchor="middle" class="body">users</text>
  <text x="247" y="841" text-anchor="middle" class="body">accounts</text>
  <text x="247" y="862" text-anchor="middle" class="body">transactions</text>
  <rect x="444" y="768" width="340" height="112" rx="12" fill="url(#slate)" class="card"/>
  <text x="614" y="795" text-anchor="middle" class="head">Crypto Utilities</text>
  <text x="614" y="820" text-anchor="middle" class="body">AES-GCM encrypt / decrypt</text>
  <text x="614" y="841" text-anchor="middle" class="body">Sensitive field protection</text>
  <text x="614" y="862" text-anchor="middle" class="small">app/utils/crypto.py</text>
  <path d="M402 824 H444" class="dash"/>

  <rect x="862" y="716" width="490" height="196" rx="18" fill="#241d3b" stroke="#7256a7" stroke-width="1.5"/>
  <text x="886" y="745" class="tag">EXTERNAL SERVICE</text>
  <rect x="902" y="768" width="410" height="112" rx="12" fill="url(#purple)" class="card"/>
  <text x="1107" y="795" text-anchor="middle" class="head">Email OTP Delivery</text>
  <text x="1107" y="820" text-anchor="middle" class="body">Flask-Mail → SMTP provider</text>
  <text x="1107" y="841" text-anchor="middle" class="body">Login verification code</text>
  <text x="1107" y="862" text-anchor="middle" class="small">Requires valid mail configuration</text>
  <path d="M221 487 V455 H1330 V768 H1312" class="dash"/>
  <text x="700" y="947" text-anchor="middle" class="subtitle">Conceptual view of the current repository implementation; production cloud hosting and managed database services require separate configuration.</text>
</svg>